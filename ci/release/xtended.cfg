// Bot Warfare XTended settings
//
// Change the values you want, then type  exec xtended.cfg  in the console,
// or add  +exec xtended.cfg  to your Plutonium launch options so it runs every time.
// On a dedicated server, copy the lines you want into your server config.
//
// Every setting is "set <name> <value>". Lines starting with // are comments.
// Tip: bots_real_preset applies a whole group of settings at once (see the XTended section).


// ================= Bot Warfare =================

// Enable this mod.
set bots_main 1

// The first player to connect will be given host.
set bots_main_firstIsHost 0

// A comma separated list of GUIDs of players who will be given host.
set bots_main_GUIDs ""

// How many seconds to wait for the host player to connect before adding bots to the match.
set bots_main_waitForHostTime 10

// Enable the in-game menu for hosts.
set bots_main_menu 1

// Enable the in-game waypoint editor at start of the game, or enable bot event prints. ; 0 - disable; 1 - for just debug events; 2 - for every event
set bots_main_debug 0

// Kick the bots at the end of a match.
set bots_main_kickBotsAtEnd 0

// The rate bots will chat at, set to 0 to disable.
set bots_main_chat 1.0

// Amount of bots to add to the game, once bots are added, resets back to 0.
set bots_manage_add 0

// Amount of players/bots (look at bots_manage_fill_mode) to maintain in the match.
set bots_manage_fill 0

// bots_manage_fill players/bots counting method; 0 - counts both players and bots; 1 - only counts bots; 2 - exactly 0 but auto adjusts bots_manage_fill to map; 3 - exactly 1 but auto adjusts bots_manage_fill to map; 4 - bots are used for balancing teams; 5 - exactly 4 but auto adjusts bots_manage_fill to map.
set bots_manage_fill_mode 0

// Bots will not be added until one player is in the game
set bots_manage_fill_watchplayers 0

// If the amount of players/bots in the match exceeds bots_manage_fill, kick bots until no longer exceeds.
set bots_manage_fill_kick 0

// If when counting players for bots_manage_fill should include spectators.
set bots_manage_fill_spec 1

// One of autoassign, allies, axis, spectator, or custom. What team the bots should be on.
set bots_team autoassign

// When bots_team is set to custom. The amount of bots to be placed on the axis team. The remainder will be placed on the allies team.
set bots_team_amount 0

// If the server should force bots' teams according to the bots_team value. When bots_team is autoassign, unbalanced teams will be balanced. This dvar is ignored when bots_team is custom.
set bots_team_force 0

// When bots_team_force is 1 and bots_team is autoassign, players/bots counting method. ; 0 - counts both players and bots; 1 - only counts bots
set bots_team_mode 0

// Bots' difficulty; 0 - Random difficulty for each bot; 1 - Easiest difficulty for all bots; 2 to 6 - Between easy and hard difficulty for all bots; 7 - The hardest difficulty for all bots; 8 - custom (look at the bots_skill__ dvars); 9 - Every difficulty parameter is randomized
set bots_skill 0

// When bots_skill is set to 8, the amount of hard difficulty bots to set on the axis team.
set bots_skill_axis_hard 0

// When bots_skill is set to 8, the amount of medium difficulty bots to set on the axis team. The remaining bots on the team will be set to easy difficulty.
set bots_skill_axis_med 0

// When bots_skill is set to 8, the amount of hard difficulty bots to set on the allies team.
set bots_skill_allies_hard 0

// When bots_skill is set to 8, the amount of medium difficulty bots to set on the allies team. The remaining bots on the team will be set to easy difficulty.
set bots_skill_allies_med 0

// The minimum difficulty level for the bots.
set bots_skill_min 1

// The maximum difficulty level for the bots.
set bots_skill_max 7

// If the bots should filter bad performing create-a-class selections.
set bots_loadout_reasonable 0

// If the bots should be able to use overpowered and annoying create-a-class selections.
set bots_loadout_allow_op 1

// What rank to set the bots; -1 - Average of all players in the match; 0 - All random; 1 or higher - Sets the bots' rank to this.
set bots_loadout_rank -1

// What prestige to set the bots; -1 - Same as host player in the match; -2 - All random; 0 or higher - Sets the bots' prestige to this.
set bots_loadout_prestige -1

// If the bots can move.
set bots_play_move 1

// If the bots can knife.
set bots_play_knife 1

// If the bots can fire.
set bots_play_fire 1

// If the bots can grenade.
set bots_play_nade 1

// If the bots can take carepackages.
set bots_play_take_carepackages 1

// If the bots can play the objective.
set bots_play_obj 1

// If the bots can camp.
set bots_play_camp 1

// If the bots can jump/drop shot.
set bots_play_jumpdrop 1

// If the bots can target other entities other than players.
set bots_play_target_other 1

// If the bots can call in killstreaks.
set bots_play_killstreak 1

// If the bots can aim down sights.
set bots_play_ads 1

// If the bots can aim.
set bots_play_aim 1


// ================= XTended =================

// Bots get a personality (rusher, balanced, cautious, support) that shapes how they play and which guns and killstreaks they pick. Loadouts are picked when a bot joins, so re-add bots after changing this.
set bots_real_traits 1

// Bots aim like humans: they overshoot new targets, flinch when hit and aim worse while moving.
set bots_real_aim 1

// Bots react to gunfire and explosions they hear (suppressors cut the range).
set bots_real_hearing 1

// Bots fall back to cover when badly hurt, then heal and reload before re-engaging.
set bots_real_retreat 1

// Bots switch to a counter class after dying repeatedly to the same thing (air, explosives, UAV, snipers, rushers). Needs custom classes (bot rank 4+).
set bots_real_counter 1

// Bots get cocky after 3 kills in a row and tilted after 3 deaths in a row, which changes how they play.
set bots_real_mood 1

// Bots take cover under a roof when enemy air killstreaks are up, unless they carry a launcher.
set bots_real_airhide 1

// Bots hold a grudge against a player who kills them 3 times and go hunting for them.
set bots_real_grudge 1

// Bots learn spots players keep getting kills from, then pre-aim them, nade them or path around them.
set bots_real_hotspots 1

// Bots tell nearby bot teammates where they spotted an enemy; teammates look over or move up.
set bots_real_teamintel 1

// Bots push when losing late, play safe when winning late, and play slow when last alive in S&D.
set bots_real_matchaware 1

// Bots make human mistakes: slow turns when shot from behind, panic spraying, reloading right after kills.
set bots_real_slipups 1

// Bots take time to type, chat in their own style (lowercase, dropped full stops, the odd typo) and reply to players.
set bots_real_chat 1

// Bots use voice callouts that match what they're doing (enemy spotted, need reinforcements, fall back, follow me, suppressing fire). Team modes only.
set bots_real_voice 1

// Bots go after whoever killed a teammate near them.
set bots_real_avenge 1

// Enemy bots adjust their skill (up to 3 steps either way) to keep human players near bots_real_adaptive_kd. Checked every 30 seconds.
set bots_real_adaptive 0

// The K/D adaptive difficulty aims to keep human players at.
set bots_real_adaptive_kd 1.2

// Bots talk to each other, react to special kills (knife, headshot, long shot, multikill...), say "you again" and praise the human MVP.
set bots_real_banter 1

// Some bots group up in parties of 2-3 on the same team that follow, avenge and cheer each other.
set bots_real_parties 1

// Deeply tilted bots sometimes rage quit and a new bot joins later; a bot sometimes leaves at the end of a match.
set bots_real_churn 1

// Bots glance at corners and long sightlines while moving.
set bots_real_preaim 1

// Bots stay and fight on mounted turrets instead of hopping off, and sometimes walk over to a free one.
set bots_real_turrets 1

// Percent of a tilted bot's death messages that are rage.
set bots_real_rage 50

// Percent chance a bot taunts a human player it kills (cocky bots add 25).
set bots_real_bait 30

// Kills or deaths in a row before a bot gets cocky or tilted (at least 2).
set bots_real_mood_streak 3

// Applies a group of settings: off, casual, competitive, chaos, or custom to set things yourself.
set bots_real_preset custom
